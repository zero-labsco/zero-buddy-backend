name: Dependency Review

# 安全门禁：在 PR 合并前用 cargo audit 检查依赖是否带已知漏洞（RUSTSEC advisories）。
# 任何带已知漏洞的更新都会被此门禁挡下，确保“先安全、再最新版”。
#
# 之前使用 actions/dependency-review-action，但它依赖仓库的 Dependency graph
# （/dependency-graph/compare API）。本仓库该 API 返回 404，且设置页没有对应开关，
# action 会直接失败并提示 "Dependency review is not supported on this repository"。
# 改用 cargo audit：只依赖 Cargo.lock，无需任何仓库设置。
# unmaintained / yanked 等警告不阻断 PR（由 audit.yml 周任务以 --deny warnings 跟进）。

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  dependency-review:
    name: Block vulnerable dependency changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit dependencies (RUSTSEC gate)
        run: cargo audit
