name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'LICENSE'
              - '**/.gitignore'

  lint-and-test:
    name: Build, Test & Lint (Rust)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting (rustfmt)
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  api-integration:
    name: API Integration Test (offline)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build

      - name: Setup Node (for test script)
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Start backend & run API integration test
        # CI 无 LLM_API_KEY -> 离线模式；ALLOW_OFFLINE=1 让 LLM 路径用例接受 source=offline。
        # 功能测试实例限流放宽，另起 3031 限流专用实例（RATE_LIMIT_PER_MIN=10）。
        run: |
          RATE_LIMIT_PER_MIN=100 ./target/debug/zero-buddy-backend > /tmp/backend-a.log 2>&1 &
          A=$!
          BIND_ADDR=127.0.0.1:3031 RATE_LIMIT_PER_MIN=10 ./target/debug/zero-buddy-backend > /tmp/backend-b.log 2>&1 &
          B=$!
          trap 'kill $A $B 2>/dev/null || true' EXIT
          # 两个实例都要等就绪：3030 跑功能用例，3031 专门跑限流用例（10/min）。
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:3030/health >/dev/null 2>&1 && curl -sf http://127.0.0.1:3031/health >/dev/null 2>&1 && break
            sleep 1
          done
          BASE_URL=http://127.0.0.1:3030 \
          RATE_LIMIT_URL=http://127.0.0.1:3031 \
          ALLOW_OFFLINE=1 \
          node scripts/api_integration_test.mjs
          STATUS=$?
          # 失败时把两个实例的日志打出来，便于定位“后端未就绪 / 用例失败”的具体原因。
          if [ "$STATUS" -ne 0 ]; then
            echo "::group::backend logs"
            tail -n 100 /tmp/backend-a.log
            tail -n 100 /tmp/backend-b.log
            echo "::endgroup::"
          fi
          exit $STATUS

  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout (full history for PR)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lint PR commits (Conventional Commits)
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  # 纯文档改动时跳过重活 job，本 job 提供绿色 check 以满足 PR 要求
  docs-check:
    name: Docs only (skip heavy CI)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    steps:
      - run: echo "Only documentation changed — skipping build/lint/test."
